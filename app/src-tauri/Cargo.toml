[package]
name = "remux"
version = "0.1.0"
description = "REMUX desktop terminal manager for local and remote tmux"
authors = ["REMUX team"]
edition = "2021"
default-run = "remux"
# Disable cargo's automatic discovery of binaries under src/bin/. Without
# this, any dev-only probe a developer drops into src/bin/ would be built
# and bundled into the Tauri .app, which is how the test_keyring probe
# ended up in the v0.1.0 release. Declare only the production binary
# explicitly below.
autobins = false

[lib]
name = "remux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "remux"
path = "src/main.rs"

[[example]]
name = "pty_claude_diag"
path = "examples/pty_claude_diag.rs"

[[example]]
name = "pty_tmux_claude_diag"
path = "examples/pty_tmux_claude_diag.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "process"] }
portable-pty = "0.9"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
keyring = "3.2"
libc = "0.2"

